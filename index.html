<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1930">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Calcolatrice scientifica</title>
<style>
:root{--bg:#1b1930;--num:#2a2748;--fn:#37335f;--fnt:#d3ccff;--op:#5b4bb8;--eq:#ffb454;--ac:#ff6f91;--txt:#f4f1ff;--dim:#9a94c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Roboto,"Segoe UI",system-ui,sans-serif;overscroll-behavior:none}
body{max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 10px)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 0;color:var(--dim);font-size:14px}
header button{background:none;border:1px solid var(--fn);color:var(--fnt);border-radius:16px;padding:6px 12px;font-size:13px}
.screen{flex:1;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;padding:8px 6px 14px;min-height:0;overflow:hidden}
#ex{font-size:26px;line-height:1.25;color:var(--txt);word-break:break-all;max-height:5.2em;overflow-y:auto;min-height:1.25em}
#rs{font-size:44px;font-weight:300;color:var(--eq);min-height:1.3em;overflow-x:auto;white-space:nowrap}
#rs.dim{color:var(--dim)}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;height:62dvh;max-height:600px}
.keys button{border:0;border-radius:14px;background:var(--num);color:var(--txt);font-size:21px;touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:inherit;padding:0}
.keys button:active{filter:brightness(1.35)}
.keys .fn{background:var(--fn);color:var(--fnt);font-size:16px}
.keys .op{background:var(--op);color:#fff;font-size:24px}
.keys .eq{background:var(--eq);color:#2a1d00;font-size:28px;grid-column:span 2}
.keys .ac{background:var(--ac);color:#2a0010;font-size:19px;font-weight:600}
.keys .on{background:var(--eq);color:#2a1d00}
#hp{position:fixed;inset:0;background:rgba(10,8,25,.85);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px 14px;max-width:480px;margin:0 auto}
#hp.show{display:flex}
#hp .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#hp button.t{background:none;border:1px solid var(--fn);color:var(--fnt);border-radius:16px;padding:7px 14px;font-size:14px}
#hl{flex:1;overflow-y:auto}
#hl div{padding:12px 4px;border-bottom:1px solid var(--fn);text-align:right}
#hl small{display:block;color:var(--dim);font-size:15px}
#hl b{font-weight:400;font-size:22px;color:var(--eq)}
#hl p{color:var(--dim);text-align:center;margin-top:40px}
#calc{flex:1;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px}
header .tabs button{border:0;background:var(--num);padding:7px 14px}
header .tabs button.on{background:var(--eq);color:#2a1d00}
#gr{display:none;flex:1;flex-direction:column;min-height:0;gap:8px;padding-top:8px}
#gr.show{display:flex}
.cw{position:relative;flex:1;min-height:120px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:14px;background:#14122a}
.zb{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}
.zb button{width:36px;height:36px;border:0;border-radius:10px;background:var(--fn);color:var(--fnt);font-size:18px;padding:0}
#rd{font-size:14px;color:var(--dim);min-height:1.3em;overflow-x:auto;white-space:nowrap}
.fr{display:flex;align-items:center;gap:8px}
.fr i{width:12px;height:12px;border-radius:6px;flex:none}
.fr input{flex:1;min-width:0;background:var(--num);color:var(--txt);border:1px solid transparent;border-radius:10px;padding:9px 10px;font-size:17px;font-family:inherit}
.fr input:focus{outline:0;border-color:var(--op)}
#qk{display:flex;gap:6px;overflow-x:auto}
#qk button{flex:none;border:0;border-radius:10px;background:var(--fn);color:var(--fnt);padding:9px 12px;font-size:16px;font-family:inherit}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 0;flex:none}
nav.tabs button{flex:none;border:0;background:var(--num);color:var(--fnt);border-radius:16px;padding:8px 14px;font-size:14px;font-family:inherit}
nav.tabs button.on{background:var(--eq);color:#2a1d00}
.keys.b{grid-template-columns:repeat(4,1fr)}.keys.b .eq{grid-column:span 1}.keys.b button{font-size:26px}
.sg{display:flex;gap:6px;flex:none}.sg button{flex:1;border:0;border-radius:10px;background:var(--num);color:var(--fnt);padding:8px;font-size:14px;font-family:inherit}.sg button.on{background:var(--op);color:#fff}
#gr.tab .cw,#gr.tab #rd,#gr.tab #qk{display:none}
#tb{display:none;flex:1;flex-direction:column;min-height:0;gap:8px}#gr.tab #tb{display:flex}
.tr{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--dim)}.tr input{width:80px;background:var(--num);color:var(--txt);border:0;border-radius:8px;padding:8px;font-size:16px}
#tt{flex:1;overflow:auto}
.dt{width:100%;border-collapse:collapse}.dt td,.dt th{padding:7px 8px;border-bottom:1px solid var(--fn);text-align:left;font-size:15px}.dt th{color:var(--dim);font-weight:500}
.dt input{width:100%;background:var(--num);color:var(--txt);border:0;border-radius:8px;padding:9px;font-size:16px;font-family:inherit}
#st,#el{display:none;flex:1;min-height:0;overflow:auto;padding-top:8px}#st.show,#el.show{display:block}
.row{display:flex;gap:8px;margin:8px 0}.bt,.row button{border:0;border-radius:10px;background:var(--fn);color:var(--fnt);padding:9px 14px;font-size:14px;font-family:inherit}
#sv{width:100%;height:190px;background:#14122a;border-radius:14px;margin-bottom:8px}.nt{font-size:12px;color:var(--dim)}
#eg{display:grid;grid-template-columns:repeat(18,42px);grid-template-rows:repeat(7,42px) 12px repeat(2,42px);gap:3px;width:max-content}
#eg button{border:0;border-radius:6px;color:#14122a;font-size:14px;font-weight:700;padding:0;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
#eg small{font-size:9px;font-weight:400}
#lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 4px;font-size:12px;color:var(--dim)}#lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
#ec{position:fixed;inset:0;background:rgba(10,8,25,.85);display:none;align-items:center;justify-content:center;padding:16px}#ec.show{display:flex}
#ek{background:var(--bg);border:1px solid var(--fn);border-radius:18px;padding:18px;width:100%;max-width:400px;max-height:92dvh;overflow:auto}
.eh{display:flex;align-items:center;gap:14px;margin-bottom:10px;font-size:24px}.eh div{color:#14122a;border-radius:12px;width:68px;height:68px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}
#ek .bt{margin-top:14px;width:100%}
</style>
</head>
<body>
<nav class="tabs" id="nv"></nav>
<header><span id="mode">Gradi</span><button id="hb">Cronologia</button></header>
<div id="calc">
<div class="screen"><div id="ex"></div><div id="rs" class="dim">0</div></div>
<div class="keys" id="keys"></div>
</div>
<div id="gr">
<div class="sg"><button id="g1" class="on">Grafico</button><button id="g2">Tabella</button></div>
<div class="cw"><canvas id="cv"></canvas><div class="zb"><button id="zi">+</button><button id="zo">−</button><button id="zr">⌂</button></div></div>
<div id="rd">Tocca il grafico per leggere i valori</div>
<div id="qk"></div>
<div id="tb"><div class="tr">Da x = <input id="t0" type="number" step="any" value="-3"> passo <input id="ts" type="number" step="any" value="1"></div><div id="tt"></div></div>
<div id="fi"></div>
</div>
<div id="st"><table class="dt" id="sd"><thead><tr><th>Valeur x<sub>i</sub></th><th>Effectif n<sub>i</sub></th></tr></thead><tbody></tbody></table>
<div class="row"><button id="sa">+ Ligne</button><button id="sr">Effacer</button></div><canvas id="sv"></canvas><div id="ss"></div></div>
<div id="el"><div id="eg"></div><div id="lg"></div></div>
<div id="ec"><div id="ek"></div></div>
<div id="hp"><div class="bar"><b>Cronologia</b><span><button class="t" id="hc">Svuota</button> <button class="t" id="hx">Chiudi</button></span></div><div id="hl"></div></div>
<script>
let expr='',deg=true,second=false,ans=0,lastRes='0',hist=[];
try{hist=JSON.parse(localStorage.getItem('calc-h')||'[]')}catch(e){}
if(hist.length)ans=hist[0].v;
const $=s=>document.querySelector(s);

// [etichetta, etichetta 2nd, testo, testo 2nd, classe]
const KS=[
['2nd','','#2nd','','fn'],['DEG','','#deg','','fn'],['(','','(','','fn'],[')','',')','','fn'],['⌫','','#bs','','fn'],
['sin','sin⁻¹','sin(','asin(','fn'],['cos','cos⁻¹','cos(','acos(','fn'],['tan','tan⁻¹','tan(','atan(','fn'],['π','','π','','fn'],['e','','e','','fn'],
['ln','eˣ','ln(','e^(','fn'],['log','10ˣ','log(','10^(','fn'],['√','∛','√(','∛(','fn'],['x²','x³','^2','^3','fn'],['xʸ','x⁻¹','^','^(-1)','fn'],
['|x|','','abs(','','fn'],['n!','','!','','fn'],['nCr','','nCr(','','fn'],['nPr','','nPr(','','fn'],[',','',',','','fn'],
['7','','7'],['8','','8'],['9','','9'],['÷','','÷','','op'],['AC','','#ac','','ac'],
['4','','4'],['5','','5'],['6','','6'],['×','','×','','op'],['Ans','','Ans','','fn'],
['1','','1'],['2','','2'],['3','','3'],['−','','−','','op'],['EXP','','×10^','','fn'],
['0','','0'],['.','','.'],['+','','+','','op'],['=','','#eq','','eq']
];
const kb=$('#keys');let K=KS;
const KB=[['AC','','#ac','','ac'],['(','','(','','fn'],[')','',')','','fn'],['÷','','÷','','op'],
['7','','7'],['8','','8'],['9','','9'],['×','','×','','op'],['4','','4'],['5','','5'],['6','','6'],['−','','−','','op'],
['1','','1'],['2','','2'],['3','','3'],['+','','+','','op'],['0','','0'],['.','','.'],['⌫','','#bs','','fn'],['=','','#eq','','eq']];
function buildKeys(){kb.innerHTML='';kb.className='keys'+(K===KB?' b':'');
  K.forEach(k=>{const b=document.createElement('button');b.textContent=k[0];if(k[4])b.className=k[4];b.onclick=()=>press(k);k.b=b;kb.appendChild(b)});paint()}

function press(k){
  navigator.vibrate&&navigator.vibrate(8);
  const a=second&&k[3]?k[3]:k[2];
  if(a[0]==='#'){
    if(a==='#2nd'){second=!second;paint();return}
    if(a==='#deg'){deg=!deg;paint();upd();return}
    if(a==='#ac'){expr='';lastRes='0';upd();return}
    if(a==='#bs'){expr=expr.replace(/(asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|ln\(|log\(|abs\(|nCr\(|nPr\(|√\(|∛\(|Ans|.)$/,'');upd();return}
    if(a==='#eq'){eq();return}
  }
  if(expr===''&&hist.length&&/^[+−×÷^!]/.test(a))expr='Ans';
  expr+=a;
  if(second){second=false;paint()}
  upd();
}
function paint(){
  K.forEach(k=>{k.b.textContent=second&&k[1]?k[1]:k[0]});
  if(K===KS){K[0].b.classList.toggle('on',second);K[1].b.textContent=deg?'DEG':'RAD'}
  $('#mode').textContent=deg?'Gradi':'Radianti';
}
function upd(){
  $('#ex').textContent=expr;$('#ex').scrollTop=1e5;
  const rs=$('#rs');
  if(expr===''){rs.textContent=lastRes;rs.className='';return}
  try{const v=evaluate(expr);rs.textContent=fmt(v);rs.className='dim'}catch(e){rs.textContent='';rs.className='dim'}
}
function eq(){
  if(expr==='')return;
  try{
    const v=evaluate(expr);ans=v;lastRes=fmt(v);
    hist.unshift({e:expr,r:lastRes,v});hist=hist.slice(0,40);save();
    $('#ex').textContent=expr+' =';expr='';
    const rs=$('#rs');rs.textContent=lastRes;rs.className='';
  }catch(e){const rs=$('#rs');rs.textContent='Errore';rs.className='dim'}
}
function save(){try{localStorage.setItem('calc-h',JSON.stringify(hist))}catch(e){}}

function fmt(r){
  r=Number(r.toPrecision(12));
  if(r===0)return '0';
  const a=Math.abs(r);
  if(a>=1e12||a<1e-9)return r.toExponential().replace('e+','e');
  return String(r);
}
function tok(s){
  const t=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(c===' '){i++;continue}
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const n=s.slice(i,j);if(n==='.'||(n.match(/\./g)||[]).length>1)throw 0;t.push({n:parseFloat(n)});i=j;continue}
    if('+-*/^!(),'.includes(c)){t.push({o:c});i++;continue}
    if(c==='×'){t.push({o:'*'});i++;continue}
    if(c==='÷'){t.push({o:'/'});i++;continue}
    if(c==='−'){t.push({o:'-'});i++;continue}
    if(c==='π'){t.push({n:Math.PI});i++;continue}
    if(c==='√'){t.push({f:'sqrt'});i++;continue}
    if(c==='∛'){t.push({f:'cbrt'});i++;continue}
    if(c==='x'||c==='X'){t.push({x:1});i++;continue}
    const m=s.slice(i).match(/^(asin|acos|atan|sin|sen|cos|tan|tg|ln|log|abs|nCr|nPr|Ans|pi|e)/);
    if(!m)throw 0;
    const AL={sen:'sin',tg:'tan'};
    if(m[1]==='e')t.push({n:Math.E});else if(m[1]==='pi')t.push({n:Math.PI});else if(m[1]==='Ans')t.push({n:ans});else t.push({f:AL[m[1]]||m[1]});
    i+=m[1].length;
  }
  return t;
}
function fact(v){if(!Number.isInteger(v)||v<0||v>170)throw 0;let r=1;for(let i=2;i<=v;i++)r*=i;return r}
function fn(f,a){
  const x=a[0],D=deg?Math.PI/180:1;
  const one=()=>{if(a.length!==1)throw 0};
  const snap=v=>Math.abs(v)<1e-14?0:v;
  switch(f){
    case 'sin':one();return snap(Math.sin(x*D));
    case 'cos':one();return snap(Math.cos(x*D));
    case 'tan':{one();const c=Math.cos(x*D);if(Math.abs(c)<1e-14)throw 0;return snap(Math.sin(x*D)/c)}
    case 'asin':one();if(Math.abs(x)>1)throw 0;return Math.asin(x)/D;
    case 'acos':one();if(Math.abs(x)>1)throw 0;return Math.acos(x)/D;
    case 'atan':one();return Math.atan(x)/D;
    case 'ln':one();if(x<=0)throw 0;return Math.log(x);
    case 'log':one();if(x<=0)throw 0;return Math.log10(x);
    case 'sqrt':one();if(x<0)throw 0;return Math.sqrt(x);
    case 'cbrt':one();return Math.cbrt(x);
    case 'abs':one();return Math.abs(x);
    case 'nCr':case 'nPr':{
      if(a.length!==2)throw 0;const n=a[0],r=a[1];
      if(!Number.isInteger(n)||!Number.isInteger(r)||r<0||r>n)throw 0;
      let v=1;
      if(f==='nPr'){for(let i=0;i<r;i++)v*=n-i}else{for(let i=1;i<=r;i++)v=v*(n-r+i)/i}
      return Math.round(v);
    }
  }
  throw 0;
}
function evaluate(s,X){return run(tok(s),X)}
function run(t,X){
  let p=0;
  const nx=()=>t[p++],isO=o=>t[p]&&t[p].o===o;
  function expr(){let v=term();while(isO('+')||isO('-')){const o=nx().o,r=term();v=o==='+'?v+r:v-r}return v}
  function term(){
    let v=un();
    for(;;){
      if(isO('*')||isO('/')){const o=nx().o,r=un();v=o==='*'?v*r:v/r}
      else if(t[p]&&(t[p].n!==undefined||t[p].f||t[p].x||isO('('))){v*=un()}
      else break;
    }
    return v;
  }
  function un(){if(isO('-')){p++;return -un()}if(isO('+')){p++;return un()}return pw()}
  function pw(){const b=pf();if(isO('^')){p++;return Math.pow(b,un())}return b}
  function pf(){let v=pr();while(isO('!')){p++;v=fact(v)}return v}
  function close(){if(isO(')'))p++;else if(p<t.length)throw 0}
  function pr(){
    const k=nx();if(!k)throw 0;
    if(k.n!==undefined)return k.n;
    if(k.x)return X;
    if(k.o==='('){const v=expr();close();return v}
    if(k.f){if(!isO('('))throw 0;p++;const a=[expr()];while(isO(',')){p++;a.push(expr())}close();return fn(k.f,a)}
    throw 0;
  }
  const r=expr();if(p<t.length)throw 0;
  if(!isFinite(r))throw 0;
  return r;
}

// cronologia
function showHist(){
  const l=$('#hl');l.innerHTML='';
  if(!hist.length){l.innerHTML='<p>Nessun calcolo ancora.</p>'}
  hist.forEach(h=>{const d=document.createElement('div');d.innerHTML='<small></small><b></b>';d.children[0].textContent=h.e;d.children[1].textContent='= '+h.r;
    d.onclick=()=>{expr=h.e;$('#hp').classList.remove('show');upd()};l.appendChild(d)});
  $('#hp').classList.add('show');
}
$('#hb').onclick=showHist;
$('#hx').onclick=()=>$('#hp').classList.remove('show');
$('#hc').onclick=()=>{hist=[];save();showHist()};

// grafico
const cv=$('#cv'),g=cv.getContext('2d'),COL=['#ffb454','#6ee7b7','#ff6f91'];
let vw={x:0,y:0,s:40},tx=null,lf=0,T=[null,null,null];
let saved=['sin(x)','x^2/4-1',''];
try{const q=JSON.parse(localStorage.getItem('calc-g'));if(Array.isArray(q)&&q.length===3)saved=q}catch(e){}
const I=[0,1,2].map(i=>{const r=document.createElement('div');r.className='fr';r.innerHTML='<i></i><input autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="f'+(i+1)+'(x)">';r.firstChild.style.background=COL[i];$('#fi').appendChild(r);
  const el=r.lastChild;el.value=saved[i];el.onfocus=()=>lf=i;el.oninput=inp;return el});
['x','^','(',')','π','√(','abs(','sin(','cos(','tan(','ln(','log(','e'].forEach(t=>{const b=document.createElement('button');b.textContent=t==='abs('?'|x|':t;b.onmousedown=e=>e.preventDefault();b.onclick=()=>ins(t);$('#qk').appendChild(b)});
function ins(t){const el=I[lf],a=el.selectionStart==null?el.value.length:el.selectionStart,b=el.selectionEnd==null?a:el.selectionEnd;el.value=el.value.slice(0,a)+t+el.value.slice(b);el.setSelectionRange(a+t.length,a+t.length);el.focus();inp()}
function inp(){
  I.forEach((el,i)=>{let ok=true;T[i]=null;if(el.value.trim()){try{T[i]=tok(el.value)}catch(e){ok=false}}el.style.borderColor=ok?'':'var(--ac)'});
  try{localStorage.setItem('calc-g',JSON.stringify(I.map(e=>e.value)))}catch(e){}
  draw();tbl();
}
function ev(i,x){const sv=deg;deg=false;try{const y=run(T[i],x);return isFinite(y)?y:null}catch(e){return null}finally{deg=sv}}
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;g.setTransform(d,0,0,d,0,0);draw()}
const W=()=>cv.clientWidth,H=()=>cv.clientHeight;
const sx=x=>W()/2+(x-vw.x)*vw.s,sy=y=>H()/2-(y-vw.y)*vw.s,ix=p=>(p-W()/2)/vw.s+vw.x,iy=p=>vw.y-(p-H()/2)/vw.s;
const nf=v=>String(Number(v.toPrecision(6)));
function draw(){
  const w=W(),h=H();if(!w)return;
  g.clearRect(0,0,w,h);
  const raw=70/vw.s,mg=Math.pow(10,Math.floor(Math.log10(raw)));
  const st=[1,2,5,10].map(m=>m*mg).find(v=>v>=raw);
  const ax=Math.min(Math.max(sx(0),0),w),ay=Math.min(Math.max(sy(0),0),h);
  g.font='11px Roboto,sans-serif';g.lineWidth=1;
  for(let v=Math.ceil(ix(0)/st)*st;v<=ix(w);v+=st){const p=Math.round(sx(v))+.5;g.strokeStyle='#2a2748';g.beginPath();g.moveTo(p,0);g.lineTo(p,h);g.stroke();
    if(Math.abs(v)>st/2){g.fillStyle='#9a94c9';g.textAlign='center';g.fillText(nf(v),p,Math.min(Math.max(ay+13,12),h-3))}}
  for(let v=Math.ceil(iy(h)/st)*st;v<=iy(0);v+=st){const p=Math.round(sy(v))+.5;g.strokeStyle='#2a2748';g.beginPath();g.moveTo(0,p);g.lineTo(w,p);g.stroke();
